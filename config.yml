# Central configuration. Override any value by setting the corresponding
# environment variable (see .env.example for suggested variables).

app:
  port: ${PORT}
  hostname: "${HOSTNAME}"
  environment: "${NODE_ENV}"
  baseUrl: "${BASE_URL}"

setup:
  initialSecret: "${SETUP_SECRET}"

security:
  jwtSecret: "${JWT_SECRET}"
  jwtExpiresIn: "24h"
  bcryptRounds: 10
  cookieSecure: ${AUTH_COOKIE_SECURE:-false}

docker:
  host: "${DOCKER_HOST}"

nginx:
  enabled: true
  containerName: "nginx-proxy"
  configPath: "/etc/nginx/sites-enabled"
  sitesPath: "/etc/nginx/sites-available"
  reloadCommand: "docker exec nginx-proxy nginx -s reload"

email:
  enabled: true
  smtp:
    host: "${SMTP_HOST:-localhost}"
    port: ${SMTP_PORT:-587}
    secure: ${SMTP_SECURE:-true}
  from:
    name: "Docker GUI"
    address: "noreply@docker-gui.local"

dns:
  enabled: true
  provider: "manual"


proxies:
  enabled: true
  autoDiscovery: false

features:
  containerManagement: true
  imageManagement: true
  volumeManagement: true
  networkManagement: true
  nginxManagement: true
  emailManagement: true
  dnsManagement: true
  sslManagement: true
  proxyManagement: true
  userManagement: true
  systemMetrics: true
  storageManagement: true

minio:
  enabled: true
  endpoint: "${MINIO_ENDPOINT:-localhost}"
  port: ${MINIO_PORT:-9000}
  useSSL: ${MINIO_USE_SSL:-false}
  accessKey: "${MINIO_ROOT_USER:-minioadmin}"
  secretKey: "${MINIO_ROOT_PASSWORD:-minioadmin}"
  console:
    port: ${MINIO_CONSOLE_PORT:-9001}


performance:
  metricsRefreshInterval: 5000
  logsRefreshInterval: 2000
  containerStatsInterval: 3000
  metricsRetentionDays: 30
  logsRetentionDays: 7
  maxLogLines: 1000

backup:
  enabled: false
  schedule: "0 2 * * *"
  path: "./backups"
  retention: 7
  includeDatabase: true
  includeConfigs: true
  includeLogs: false
