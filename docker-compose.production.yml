# Production setup with real email server
services:
  # Main Docker GUI Application
  docker-gui:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: docker-gui
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - docker-gui-data:/app/data
      - nginx-configs:/etc/nginx-managed
      - ssl-certificates:/etc/ssl-managed
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DOCKER_HOST: unix:///var/run/docker.sock
      DATABASE_URL: file:/app/data/docker-gui.db
      JWT_SECRET: ${JWT_SECRET}
      # Nginx
      NGINX_CONTAINER_NAME: nginx-proxy
      NGINX_CONFIG_PATH: /etc/nginx-managed
      # Email
      SMTP_HOST: postfix
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-noreply@yourdomain.com}
      # DNS
      DNS_PROVIDER: manual
    restart: unless-stopped
    networks:
      - docker-gui-network
    depends_on:
      nginx-proxy:
        condition: service_healthy
      postfix:
        condition: service_started

  # Nginx Reverse Proxy
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx-configs:/etc/nginx/conf.d
      - ssl-certificates:/etc/nginx/ssl
      - nginx-logs:/var/log/nginx
      - certbot-www:/var/www/certbot:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    restart: unless-stopped
    networks:
      - docker-gui-network
    command: >
      /bin/sh -c "
      if [ ! -f /etc/nginx/ssl/default.key ]; then
        apk add --no-cache openssl &&
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 
        -keyout /etc/nginx/ssl/default.key 
        -out /etc/nginx/ssl/default.crt 
        -subj '/CN=localhost';
      fi &&
      nginx -g 'daemon off;'
      "
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postfix:
    build:
      context: ./mail/postfix
      dockerfile: Dockerfile
    container_name: postfix
    hostname: ${MAIL_HOSTNAME:-mail.yourdomain.com}
    env_file:
      - .env
    environment:
      - MAIL_DOMAIN=${MAIL_DOMAIN:-yourdomain.com}
      - RSPAMD_HOST=rspamd
      - RSPAMD_PORT=11332
      - DOVECOT_LMTP_HOST=dovecot
      - DOVECOT_LMTP_PORT=2525
      - DKIM_HOST=opendkim
      - DKIM_PORT=8891
    ports:
      - "25:25"
      - "587:587"
    volumes:
      - mail-spool:/var/spool/postfix
      - mail-maildir:/var/mail
      - mail-logs:/var/log/mail
      - ssl-certificates:/etc/letsencrypt:ro
      - ./config/mail/postfix:/etc/postfix/custom:ro
      - ./config/mail/shared:/etc/mail-shared:ro
    restart: unless-stopped
    depends_on:
      - dovecot
      - rspamd
      - opendkim
      - redis
    networks:
      - docker-gui-network

  dovecot:
    build:
      context: ./mail/dovecot
      dockerfile: Dockerfile
    container_name: dovecot
    hostname: ${MAIL_HOSTNAME:-mail.yourdomain.com}
    ports:
      - "993:993"
    environment:
      - MAIL_DOMAIN=${MAIL_DOMAIN:-yourdomain.com}
    volumes:
      - mail-maildir:/var/mail
      - mail-logs:/var/log/mail
      - ssl-certificates:/etc/letsencrypt:ro
      - ./config/mail/dovecot:/etc/dovecot/conf.d:ro
      - ./config/mail/shared:/etc/mail-shared:ro
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - docker-gui-network

  rspamd:
    build:
      context: ./mail/rspamd
      dockerfile: Dockerfile
    container_name: rspamd
    environment:
      - REDIS_HOST=redis
    ports:
      - "11334:11334"
    volumes:
      - mail-rspamd:/var/lib/rspamd
      - mail-logs:/var/log/rspamd
      - ./config/mail/rspamd:/etc/rspamd/local.d:ro
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - docker-gui-network

  opendkim:
    build:
      context: ./mail/opendkim
      dockerfile: Dockerfile
    container_name: opendkim
    ports:
      - "8891:8891"
    volumes:
      - mail-opendkim:/var/lib/opendkim
      - ./config/mail/opendkim:/etc/opendkim
    restart: unless-stopped
    networks:
      - docker-gui-network

  redis:
    image: redis:7-alpine
    container_name: mail-redis
    command: redis-server --save 60 1000 --appendonly yes
    volumes:
      - mail-redis:/data
    restart: unless-stopped
    networks:
      - docker-gui-network

  fail2ban:
    build:
      context: ./mail/fail2ban
      dockerfile: Dockerfile
    container_name: mail-fail2ban
    depends_on:
      - postfix
      - dovecot
    cap_add:
      - NET_ADMIN
    volumes:
      - mail-logs:/var/log/mail
      - ./config/mail/shared:/etc/mail-shared:ro
    restart: unless-stopped
    networks:
      - docker-gui-network

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ssl-certificates:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - docker-gui-network
    depends_on:
      - nginx-proxy

volumes:
  docker-gui-data:
    driver: local
  nginx-configs:
    driver: local
  ssl-certificates:
    driver: local
  nginx-logs:
    driver: local
  certbot-www:
    driver: local
  mail-spool:
    driver: local
  mail-maildir:
    driver: local
  mail-logs:
    driver: local
  mail-opendkim:
    driver: local
  mail-rspamd:
    driver: local
  mail-redis:
    driver: local

networks:
  docker-gui-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
