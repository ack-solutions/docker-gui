# Local "try it" stack — runs the SAME api + web images the installer builds,
# but from the repo root (no /opt install). For seeing the GUI + smoke-testing
# the full container stack on your machine.
#
#   bash scripts/run-local.sh         # build + start + create admin + print URL
#   docker compose -f docker-compose.local.yml logs -f
#   docker compose -f docker-compose.local.yml down -v
#
# This mirrors a fresh Linux-server install: the api manages feature containers
# via the Docker socket, exactly as on a real server.

name: docker-gui-local

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: docker-gui-api:local
    container_name: docker-gui-local-api
    # Run as root locally so the api can read the Docker socket (so the
    # Containers/Images/Features pages work). Production uses a dedicated user.
    user: "0:0"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: "localtry-jwt-secret-not-for-production-0123456789abcdef"
      SETUP_SECRET: "localtry-setup-secret-0123456789abcdef"
      DATABASE_URL: file:/data/app.db
      API_HOST: 0.0.0.0
      API_PORT: 4000
      CORS_ORIGINS: "http://localhost:3000"
      LOG_PRETTY: "true"
      DOCKER_GUI_NETWORK: docker-gui-local_dgui
      # Reverse proxy: the api talks to Caddy's admin API over the docker
      # network. Matches the well-known feature-container name.
      CADDY_ADMIN_URL: "http://docker-gui-caddy:2019"
      CADDY_DEFAULT_LE_EMAIL: "admin@local.test"
    volumes:
      - app-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "4000"
    # Published to localhost so a host-run `yarn dev` web can reach it during
    # UI development. Harmless in the local stack.
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - dgui

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # Baked into the build — Next resolves the /api proxy at build time.
        API_PROXY_TARGET: "http://api:4000"
    image: docker-gui-web:local
    container_name: docker-gui-local-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: "http://api:4000"
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - dgui

  # Reverse proxy. In production this is launched on demand by the Features
  # page (same image + container name + admin port); here we run it directly
  # so the Sites flow is testable end-to-end. Admin API stays internal.
  caddy:
    image: caddy:2-alpine
    container_name: docker-gui-caddy
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/initial.json", "--resume"]
    volumes:
      - ./docker/caddy/initial.json:/etc/caddy/initial.json:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "18080:80"
      - "18443:443"
    networks:
      - dgui

volumes:
  app-data:
  caddy-data:
  caddy-config:

networks:
  dgui:
    driver: bridge
