# Production stack for docker-gui.
#
# Usage:
#   docker compose up -d --build
#
# Required env (in .env or shell): JWT_SECRET, SETUP_SECRET
# Both must be 32+ random bytes (use `openssl rand -hex 32`).
#
# The api container needs read-only access to the host Docker socket so it
# can manage the host's containers/images/volumes/networks.

name: docker-gui

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: docker-gui-api:local
    container_name: docker-gui-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (run: openssl rand -hex 32)}
      SETUP_SECRET: ${SETUP_SECRET:?SETUP_SECRET is required (run: openssl rand -hex 32)}
      DATABASE_URL: file:/data/app.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - app-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "4000"
    networks:
      - dgui

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: docker-gui-web:local
    container_name: docker-gui-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dgui

volumes:
  app-data:

networks:
  dgui:
    driver: bridge
