# Production stack for docker-gui.
#
# Usage:
#   cd /opt/docker-gui && docker compose up -d --build
#
# Or via the CLI wrapper:
#   docker-gui start
#
# Required env (in .env in the same dir as this file):
#   JWT_SECRET, SETUP_SECRET — both 32+ random bytes (openssl rand -hex 32)
#
# The api container needs read-only access to the host Docker socket so it
# can manage the host's containers/images/volumes/networks.
#
# Caddy fronts public traffic on :80/:443. Sites managed via the UI under
# /sites are served through Caddy; the web container is also exposed
# directly on WEB_PORT so first-time admin bootstrap works before any
# Caddy site rules exist.
#
# Source code lives in ./source (refreshed on each install/update). User
# config (config.yml, .env) lives at the install root and is preserved
# across updates.

name: docker-gui

services:
  api:
    build:
      context: ./source
      dockerfile: docker/Dockerfile.api
    image: docker-gui-api:local
    container_name: docker-gui-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Secrets — required, sourced from .env at the install root
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (run: openssl rand -hex 32)}
      SETUP_SECRET: ${SETUP_SECRET:?SETUP_SECRET is required (run: openssl rand -hex 32)}
      # DB lives on a named volume mounted at /data
      DATABASE_URL: file:/data/app.db
      # config.yml is mounted read-only below; CONFIG_PATH points to it
      CONFIG_PATH: /etc/docker-gui/config.yml
    volumes:
      - app-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount the user-edited config.yml read-only into the api container.
      # Edit /opt/docker-gui/config.yml on the host and `docker-gui restart`
      # to apply.
      - ./config.yml:/etc/docker-gui/config.yml:ro
    expose:
      - "4000"
    networks:
      - dgui

  web:
    build:
      context: ./source
      dockerfile: docker/Dockerfile.web
    image: docker-gui-web:local
    container_name: docker-gui-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dgui

  caddy:
    image: caddy:2-alpine
    container_name: docker-gui-caddy
    restart: unless-stopped
    # --resume picks up the most recent config that the api applied via the
    # admin API. On first run there's no saved config — bootstrap from the
    # initial.json which exposes only the admin endpoint.
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/initial.json
      - --resume
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/initial.json:/etc/caddy/initial.json:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - dgui

volumes:
  app-data:
  caddy-data:
  caddy-config:

networks:
  dgui:
    driver: bridge
