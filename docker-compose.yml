# Production stack for docker-gui — minimal core.
#
# Only `api` and `web` are baked in. Optional features (Caddy reverse proxy,
# MinIO storage, email, etc.) are toggled at runtime from the Features page
# in the UI — the api manages those containers directly via the Docker
# socket. This keeps the install lightweight and avoids reserving ports
# (80, 443, …) on first boot.
#
# Usage:
#   cd /opt/docker-gui && docker compose up -d --build
#
# Or via the CLI wrapper:
#   docker-gui start
#
# Required env (in .env in the same dir as this file):
#   JWT_SECRET, SETUP_SECRET — both 32+ random bytes (openssl rand -hex 32)
#
# The api container needs access to the host Docker socket so it can manage
# containers/images/volumes/networks AND start/stop optional feature
# containers (Caddy, etc.) on demand.
#
# Source code lives in ./source (refreshed on each install/update). User
# config (config.yml, .env) lives at the install root and is preserved
# across updates.

name: docker-gui

services:
  api:
    build:
      context: ./source
      dockerfile: docker/Dockerfile.api
    image: docker-gui-api:local
    container_name: docker-gui-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Secrets — required, sourced from .env at the install root.
      # Compose substitutes ${VAR:?msg} at startup; if the var is unset or
      # empty, compose aborts with the message. Values are quoted so YAML
      # parsers don't trip on the inner ":(".
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - run: openssl rand -hex 32}"
      SETUP_SECRET: "${SETUP_SECRET:?SETUP_SECRET is required - run: openssl rand -hex 32}"
      # DB lives on a named volume mounted at /data
      DATABASE_URL: file:/data/app.db
      # config.yml is mounted read-only below; CONFIG_PATH points to it
      CONFIG_PATH: /etc/docker-gui/config.yml
      # Compose project + network names — the api uses these to attach
      # feature containers (Caddy, etc.) to the same network as itself.
      DOCKER_GUI_PROJECT: docker-gui
      DOCKER_GUI_NETWORK: docker-gui_dgui
    volumes:
      - app-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the user-edited config.yml read-only into the api container.
      # Edit /opt/docker-gui/config.yml on the host and `docker-gui restart`
      # to apply.
      - ./config.yml:/etc/docker-gui/config.yml:ro
      # Mount the caddy bootstrap config so we can hand it to the caddy
      # container when the user enables the Sites feature.
      - ./caddy/initial.json:/etc/docker-gui/caddy/initial.json:ro
    expose:
      - "4000"
    networks:
      - dgui

  web:
    build:
      context: ./source
      dockerfile: docker/Dockerfile.web
      args:
        # Next bakes the /api proxy target at BUILD time (runtime env is
        # ignored), so it must be a build arg. The api is always `api:4000`.
        API_PROXY_TARGET: http://api:4000
    image: docker-gui-web:local
    container_name: docker-gui-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dgui

volumes:
  app-data:
  # Caddy volumes are declared so they survive feature disable→enable
  # cycles. They're created on demand by the api when Sites is enabled.
  caddy-data:
  caddy-config:
  # Static-site web roots, file-served by Caddy. The api streams deploys into
  # the Caddy container (never mounts this itself).
  caddy-www:

networks:
  dgui:
    driver: bridge
