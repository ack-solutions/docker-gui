services:
  # Main Docker GUI Application
  docker-gui:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: docker-gui-full
    env_file:
      - .env
    environment:
      # Override DOCKER_HOST to use the mounted socket inside the container
      DOCKER_HOST: unix:///var/run/docker.sock
    command: sh -c "prisma db push --accept-data-loss && yarn db:seed && yarn dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - docker-gui-node-modules:/app/node_modules
      - ./.data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - nginx-sites-enabled:/etc/nginx/sites-enabled
      - nginx-sites-available:/etc/nginx/sites-available
      - letsencrypt-webroot:/var/www/letsencrypt
      - letsencrypt-certs:/etc/letsencrypt
    restart: unless-stopped
    networks:
      - docker-gui-network
    depends_on:
      - mailhog
      - powerdns
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (Managed by Docker GUI)
  # This nginx routes domains to your containers/services
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-sites-enabled:/etc/nginx/sites-enabled
      - nginx-sites-available:/etc/nginx/sites-available
      - letsencrypt-webroot:/var/www/letsencrypt
      - letsencrypt-certs:/etc/letsencrypt
    restart: unless-stopped
    networks:
      - docker-gui-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Email Server (MailHog for development/testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    restart: unless-stopped
    networks:
      - docker-gui-network
    environment:
      MH_STORAGE: maildir
      MH_MAILDIR_PATH: /maildir
    volumes:
      - mailhog-data:/maildir

  # DNS Server (PowerDNS with SQLite backend)
  # NOTE: Ports 53 and 5353 conflict with macOS services. Using 15353 for development.
  powerdns:
    image: powerdns/pdns-auth-master:latest
    container_name: powerdns
    ports:
      # Port 53 is used by macOS DNS, Port 5353 is used by mDNS
      # Uncomment these for Linux or if you've disabled macOS DNS:
      # - "53:53/tcp"
      # - "53:53/udp"
      # Using port 15353 for development (less likely to conflict):
      - "15353:53/tcp"    # Alternate DNS port
      - "15353:53/udp"    # Alternate DNS port
    environment:
      PDNS_AUTH_API_KEY: ${DNS_API_KEY:-cd9d88eecd2f4969aeb69291acdca232}
      PDNS_WEBSERVER: "yes"
      PDNS_WEBSERVER_ADDRESS: "0.0.0.0"
      PDNS_WEBSERVER_PORT: "8081"
      # Restrict API access to the internal docker-gui network (no public UI)
      PDNS_WEBSERVER_ALLOW_FROM: "172.21.0.0/16"
      PDNS_API: "yes"
      PDNS_API_KEY: ${DNS_API_KEY:-cd9d88eecd2f4969aeb69291acdca232}
      PDNS_LAUNCH: gsqlite3
      PDNS_GSQLITE3_DATABASE: /var/lib/powerdns/pdns.sqlite3
    volumes:
      - powerdns-data:/var/lib/powerdns
    restart: unless-stopped
    networks:
      - docker-gui-network
    healthcheck:
      test: ["CMD", "pdns_control", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  docker-gui-node-modules:
    driver: local
  nginx-sites-enabled:
    driver: local
  nginx-sites-available:
    driver: local
  letsencrypt-webroot:
    driver: local
  letsencrypt-certs:
    driver: local
  mailhog-data:
    driver: local
  powerdns-data:
    driver: local

networks:
  docker-gui-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
