version: "3.9"

services:
  # Main Docker GUI Application
  docker-gui:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: docker-gui-full
    command: sh -c "yarn db:migrate && yarn db:seed && yarn dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - docker-gui-node-modules:/app/node_modules
      - docker-gui-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - nginx-sites-enabled:/etc/nginx/sites-enabled
      - nginx-sites-available:/etc/nginx/sites-available
      - letsencrypt-webroot:/var/www/letsencrypt
      - letsencrypt-certs:/etc/letsencrypt
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DOCKER_HOST: unix:///var/run/docker.sock
      DATABASE_URL: file:/app/data/docker-gui.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Super Administrator}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SYSTEM_METRICS_PROVIDER: docker
      # Nginx integration
      NGINX_CONTAINER_NAME: nginx-proxy
      NGINX_CONFIG_PATH: /etc/nginx/sites-enabled
      NGINX_RELOAD_COMMAND: docker exec nginx-proxy nginx -s reload
      # Email integration
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # DNS integration
      DNS_SERVER: ${DNS_SERVER:-powerdns}
      DNS_API_KEY: ${DNS_API_KEY:-pdns-secret-key}
    restart: unless-stopped
    networks:
      - docker-gui-network
    depends_on:
      - mailhog
      - powerdns
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (Managed by Docker GUI)
  # This nginx routes domains to your containers/services
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-sites-enabled:/etc/nginx/sites-enabled
      - nginx-sites-available:/etc/nginx/sites-available
      - letsencrypt-webroot:/var/www/letsencrypt
      - letsencrypt-certs:/etc/letsencrypt
    restart: unless-stopped
    networks:
      - docker-gui-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Email Server (MailHog for development/testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    restart: unless-stopped
    networks:
      - docker-gui-network
    environment:
      MH_STORAGE: maildir
      MH_MAILDIR_PATH: /maildir
    volumes:
      - mailhog-data:/maildir

  # DNS Server (PowerDNS with SQLite backend)
  # NOTE: Ports 53 and 5353 conflict with macOS services. Using 15353 for development.
  powerdns:
    image: powerdns/pdns-auth-master:latest
    container_name: powerdns
    ports:
      # Port 53 is used by macOS DNS, Port 5353 is used by mDNS
      # Uncomment these for Linux or if you've disabled macOS DNS:
      # - "53:53/tcp"
      # - "53:53/udp"
      # Using port 15353 for development (less likely to conflict):
      - "15353:53/tcp"    # Alternate DNS port
      - "15353:53/udp"    # Alternate DNS port
      - "8081:8081"       # PowerDNS API
    environment:
      PDNS_AUTH_API_KEY: ${DNS_API_KEY:-pdns-secret-key}
      PDNS_WEBSERVER: "yes"
      PDNS_WEBSERVER_ADDRESS: "0.0.0.0"
      PDNS_WEBSERVER_PORT: "8081"
      PDNS_WEBSERVER_ALLOW_FROM: "0.0.0.0/0"
      PDNS_API: "yes"
      PDNS_API_KEY: ${DNS_API_KEY:-pdns-secret-key}
      PDNS_LAUNCH: gsqlite3
      PDNS_GSQLITE3_DATABASE: /var/lib/powerdns/pdns.sqlite3
    volumes:
      - powerdns-data:/var/lib/powerdns
    restart: unless-stopped
    networks:
      - docker-gui-network
    healthcheck:
      test: ["CMD", "pdns_control", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  docker-gui-node-modules:
  docker-gui-data:
    driver: local
  nginx-sites-enabled:
    driver: local
  nginx-sites-available:
    driver: local
  letsencrypt-webroot:
    driver: local
  letsencrypt-certs:
    driver: local
  mailhog-data:
    driver: local
  powerdns-data:
    driver: local

networks:
  docker-gui-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

