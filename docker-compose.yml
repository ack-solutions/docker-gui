services:
  # Main Docker GUI Application
  docker-gui:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: docker-gui-full
    env_file:
      - .env
    environment:
      # Override DOCKER_HOST to use the mounted socket inside the container
      DOCKER_HOST: unix:///var/run/docker.sock
    command: sh -c "prisma db push --accept-data-loss && yarn db:seed && yarn dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - docker-gui-node-modules:/app/node_modules
      - ./.data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - nginx-sites-enabled:/etc/nginx/sites-enabled
      - nginx-sites-available:/etc/nginx/sites-available
      - letsencrypt-webroot:/var/www/letsencrypt
      - letsencrypt-certs:/etc/letsencrypt
    restart: unless-stopped
    networks:
      - docker-gui-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (Managed by Docker GUI)
  # This nginx routes domains to your containers/services
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-sites-enabled:/etc/nginx/sites-enabled
      - nginx-sites-available:/etc/nginx/sites-available
      - letsencrypt-webroot:/var/www/letsencrypt
      - letsencrypt-certs:/etc/letsencrypt
    restart: unless-stopped
    networks:
      - docker-gui-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3


  mailserver:
    image: mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail
    domainname: localhost
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - ./data/mail-data:/var/mail
      - ./data/mail-state:/var/mail-state
      - ./data/mail-logs:/var/log/mail
      - ./data/mail-config:/tmp/docker-mailserver
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - PERMIT_DOCKER=network
      - DMS_DEBUG=0
    cap_add:
      - NET_ADMIN
    restart: always
    networks:
      - docker-gui-network

volumes:
  docker-gui-node-modules:
    driver: local
  nginx-sites-enabled:
    driver: local
  nginx-sites-available:
    driver: local
  letsencrypt-webroot:
    driver: local
  letsencrypt-certs:
    driver: local

networks:
  docker-gui-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
